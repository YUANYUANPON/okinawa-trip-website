<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的沖繩自駕遊</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <main>
        <!-- 標頭 (這個會一直顯示在最上方) -->
        <header>
            <h1>🛫OKINAWA 帶爸媽沖繩自由行</h1>
            <p>8天7夜自駕旅程｜2026.10.21 - 10.28</p>
        </header>

        <!-- 分頁 1：今天 (預設先隱藏) -->
        <section id="today" class="tab-content">
            <h2 id="today-header">今日行程</h2>
            
            <!-- 這個容器會由程式自動填入當天的行程內容 -->
            <div id="today-schedule-container">
                <p>正在載入今日行程...</p>
            </div>

            <!-- 地圖按鈕與容器保留在最下方 -->
            <button id="toggle-map-btn" class="btn-floating">🗺️ 切換地圖路線</button>
            <div id="map-container" style="height: 500px; display: none; border-radius: 12px; margin-top: 16px;"></div>
        </section>

        <!-- 分頁 2：行程 (預設先隱藏) -->
        <section id="itinerary" class="tab-content">
            <h2>行程總覽</h2>

            <div class="day-selector">
                <button class="day-btn" data-day="day1">Day 1</button>
                <button class="day-btn" data-day="day2">Day 2</button>
                <button class="day-btn" data-day="day3">Day 3</button>
                <button class="day-btn" data-day="day4">Day 4</button>
                <button class="day-btn" data-day="day5">Day 5</button>
                <button class="day-btn" data-day="day6">Day 6</button>
                <button class="day-btn" data-day="day7">Day 7</button>
                <button class="day-btn" data-day="day8">Day 8</button>
            </div>

            <div id="day1" class="day-content active"></div>
            <div id="day2" class="day-content"></div>
            <div id="day3" class="day-content"></div>
            <div id="day4" class="day-content"></div>
            <div id="day5" class="day-content"></div>
            <div id="day6" class="day-content"></div>
            <div id="day7" class="day-content"></div>
            <div id="day8" class="day-content"></div>
        </section>
        
        <!-- 分頁 3：花費 (預設顯示，加上 active) -->
        <section id="expense" class="tab-content active">
            <div class="expense-wrapper">
                <div class="expense-card">
                    <p class="sub-title">旅途中的每一筆</p>
                    <h2>記下花費</h2>

                    <div class="form-row">
                        <input type="number" id="exp-amount" placeholder="日幣金額 ¥" />
                        <select id="exp-category">
                            <option value="餐飲">餐飲</option>
                            <option value="交通">交通</option>
                            <option value="購物">購物</option>
                            <option value="住宿">住宿</option>
                            <option value="門票">門票</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <input type="text" id="exp-note" placeholder="備註，例如：便利商店早餐" />
                    </div>

                    <button id="add-exp-btn" class="btn-submit">加入這筆花費</button>

                    <div class="total-box">
                        <span class="total-label">目前總額</span>
                        <div class="total-amount">
                            <strong id="total-jpy">¥0</strong>
                            <span id="total-twd">約 NT$0</span>
                        </div>
                    </div>

                    <ul id="expense-list" class="expense-list">
                        </ul>
                </div>
                <button id="export-exp-btn" class="btn-submit" style="background-color: #4a5568; margin-top: 16px;">📥 匯出花費明細 (txt)</button>

                <div class="expense-info-card">
                    <p class="sub-title">旅程預算觀察</p>
                    <h3>隨手記就好</h3>
                    <p>花費資料只會保存在這台裝置的瀏覽器。若要清除，可刪除下方紀錄。</p>
                </div>
            </div>
        </section>

        <!-- 分頁 4：換算 (預設先隱藏) -->
        <section id="notes" class="tab-content">
            <div class="expense-card">
                <p class="sub-title">隨手筆記</p>
                <h2>旅途日誌</h2>
                <textarea id="journal-text" rows="12" placeholder="寫下今天的旅途心情、天氣或突發事件..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 12px; font-family: inherit; resize: vertical;"></textarea>
                <button id="export-notes-btn" class="btn-submit">📥 匯出日誌 (txt)</button>
            </div>
        </section>
    </main>

    <!-- ★ 底部導航列放在這裡 (main 之外，script 之前) ★ -->
    <nav class="bottom-nav">
        <button class="nav-btn" data-target="today">今天</button>
        <button class="nav-btn" data-target="itinerary">行程</button>
        <!-- 這裡的 active 代表按鈕預設為選中狀態 -->
        <button class="nav-btn active" data-target="expense">花費</button>
        <button class="nav-btn" data-target="notes">筆記</button>
    </nav>

    <!-- 確保 script 在最底部載入 -->
    <script src="script.js"></script>
</body>
</html>
